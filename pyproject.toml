[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mouse-brain-planner"
version = "0.1.0"
description = "Experimental macOS workspace for pinned mouse-atlas data and static views."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Mouse Brain Surgery Planner contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "PySide6==6.10.3",
  "brainglobe-atlasapi==2.3.1",
  "nibabel==5.4.2",
  "numpy==2.5.1",
  "pandas==3.0.3",
  "Pillow==12.3.0",
  "platformdirs==4.11.0",
  "pooch==1.9.0",
  "pydantic==2.13.4",
  "pyvista==0.48.4",
  "pyvistaqt==0.12.0",
  "scikit-image==0.26.0",
  "scipy==1.18.0",
  "tifffile==2026.7.14",
  "vtk==9.6.2",
]

[project.scripts]
mouse-brain-planner = "mouse_brain_planner.cli:main"

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-qt==4.5.0",
  "ruff==0.15.22",
]
packaging = ["pyinstaller==6.21.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mouse_brain_planner"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
minversion = "9.0"
testpaths = ["tests"]
markers = [
  "gui: tests that create Qt widgets",
  "integration: tests that cross module or external API boundaries",
  "atlas_download: tests that download a real atlas and are disabled by default",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "NPY", "PERF", "PTH", "RUF", "UP"]
ignore = ["N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mouse_brain_planner"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "brainglobe_atlasapi.*",
  "pyvista.*",
  "pyvistaqt.*",
  "vtkmodules.*",
]
ignore_missing_imports = true
